name: FlowRunner
description: Install a pinned FlowRunner, execute a Flow, and publish its report
inputs:
  version:
    description: Exact four-part FlowRunner release version
    required: true
  file:
    description: Flow workflow file, relative to the checkout
    required: true
  workflow:
    description: Workflow ID or name (omit for the file default)
    default: ''
  variables:
    description: One name=value variable per line
    default: ''
  report:
    description: HTML report destination (JSON and Markdown sidecars use the same stem)
    default: .flow/report.html
  artifact-name:
    description: Optional HTML artifact basename (otherwise a unique name is generated)
    default: ''
outputs:
  report-url:
    description: GitHub artifact URL for the HTML report
    value: ${{ steps.report.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - name: Restore FlowRunner download cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/flow-runner-cache
        key: flow-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
    - name: Install FlowRunner (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        FLOW_VERSION: ${{ inputs.version }}
        FLOW_RUNNER_CACHE: ${{ runner.temp }}/flow-runner-cache
      run: bash "$GITHUB_ACTION_PATH/install.sh" "$FLOW_VERSION"
    - name: Install FlowRunner (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        FLOW_VERSION: ${{ inputs.version }}
        FLOW_RUNNER_CACHE: ${{ runner.temp }}/flow-runner-cache
      run: '& "$env:GITHUB_ACTION_PATH/install.ps1" -Version $env:FLOW_VERSION'
    - name: Run Flow
      id: flow
      shell: bash
      env:
        FLOW_FILE: ${{ inputs.file }}
        FLOW_WORKFLOW: ${{ inputs.workflow }}
        FLOW_VARIABLES: ${{ inputs.variables }}
        FLOW_HTML_REPORT: ${{ inputs.report }}
        FLOW_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"$FLOW_RUNNER_PYTHON" "$GITHUB_ACTION_PATH/run.py"'
    - name: Upload HTML report
      id: report
      if: always() && steps.flow.outputs.flow_upload != ''
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.flow.outputs.flow_upload }}
        archive: false
        if-no-files-found: warn
    - name: Publish Flow summary
      if: always() && steps.flow.outputs.flow_summary != ''
      shell: bash
      env:
        FLOW_SUMMARY: ${{ steps.flow.outputs.flow_summary }}
        FLOW_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
      run: '"$FLOW_RUNNER_HOME/bin/FlowRunner" --publish-summary "$FLOW_SUMMARY" --ci github'
